name: Live smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sangam-live-smoke
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Coolify and verify the public deployment
        env:
          LIVE_BASE_URL: https://sangam.vitan.in
        run: |
          for attempt in $(seq 1 20); do
            if node scripts/verify-live.mjs; then exit 0; fi
            echo "Deployment not ready yet (attempt $attempt/20)"
            sleep 15
          done
          exit 1
      - name: Verify configured room workbook
        env:
          ROOM_SHEET_LIVE_SMOKE: ${{ secrets.ROOM_SHEET_LIVE_SMOKE }}
          ROOM_SHEET_SPREADSHEET_ID: ${{ secrets.ROOM_SHEET_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        working-directory: app
        run: npm run verify:room-sheet
