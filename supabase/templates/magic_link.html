<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f2ea;font-family:Arial,sans-serif;color:#34271d">
    <div style="max-width:480px;margin:0 auto;padding:32px 20px">
      <div style="background:#ffffff;border:1px solid #e5d8c8;border-radius:16px;padding:28px;text-align:center">
        <p style="margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#8b5e3c">Sangam</p>
        <h1 style="margin:0 0 16px;font-size:24px">Your sign-in code</h1>
        <p style="margin:0 0 18px;color:#67584d">Enter this six-digit code on the Sangam sign-in screen:</p>
        <div style="font-size:34px;font-weight:700;letter-spacing:.18em;padding:16px;background:#fbf7f1;border-radius:12px">{{ .Token }}</div>
        <p style="margin:18px 0 0;font-size:13px;color:#7d6e63">This code is valid for 60 minutes. Only the newest code works. Sangam will never ask you to forward this email.</p>
      </div>
    </div>
  </body>
</html>
